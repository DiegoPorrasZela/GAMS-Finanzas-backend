spring.application.name=gams-finanzas

# Variables locales (contraseña de la BD, etc.) en backend/.env: ese archivo NO se sube a GitHub.
# En producción (Render) los mismos valores llegan como variables de entorno.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# ---- Base de datos ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gams_finanzas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Flyway crea las tablas (src/main/resources/db/migration); Hibernate solo valida que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# ---- Seguridad (JWT) ----
# Sin valor por defecto a propósito: si falta JWT_SECRETO la app no arranca (así nunca firma con una clave conocida)
app.jwt.secreto=${JWT_SECRETO}
# Duración de la sesión: después de este tiempo hay que volver a iniciar sesión
app.jwt.horas=${JWT_HORAS:8}

# ---- Aplicación ----
# Orígenes que pueden llamar al API desde el navegador (separados por coma, sin "/" al final)
app.cors.origenes=${CORS_ORIGENES:http://localhost:4200}

# Usuarios que se crean al iniciar si no existen.
# La contraseña del admin NO tiene valor por defecto (el repo es público): va en ADMIN_PASSWORD.
# La cuenta demo es pública a propósito, para que cualquiera pueda probar la aplicación.
app.admin.email=${ADMIN_EMAIL:admin@gams.pe}
app.admin.password=${ADMIN_PASSWORD}
app.demo.password=${DEMO_PASSWORD:demo123}
